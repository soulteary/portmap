name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep native race coverage on every supported development platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -count=1

        if: "!(github.event_name == 'pull_request' && runner.os == 'Linux')"
      - name: Remove stale generated report evidence
        if: always() && (github.event_name == 'pull_request' && runner.os == 'Linux')
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.2)
        id: go_test_report
        uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1  # v1.1.2
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "0"
          test_args: "-count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
      - name: Go quality report (v1.1.3)
        id: go_report_card
        uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970  # v1.1.3
        with:
          directory: "."
          version: "v1.1.3"
          threshold: "0"
          report: "true"
          commit: "false"
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
      - name: Restore project Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: go build
        run: go build ./...

      - name: Upload read-only PR quality evidence
        if: always() && (github.event_name == 'pull_request' && runner.os == 'Linux')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read
  cross-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: cross build (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: verify go.mod and go.sum
        run: go mod tidy -diff
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build static binary
        env:
          CGO_ENABLED: 0
        run: go build -o portmap .
      - name: build and verify non-root image
        run: |
          mkdir -p build/container-test
          cp Dockerfile portmap build/container-test/
          docker build -t portmap:test build/container-test
          test "$(docker image inspect --format '{{.Config.User}}' portmap:test)" = "65532:65532"
          docker run --rm portmap:test version
