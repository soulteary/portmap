# portmap 配置文件示例（顶层嵌套布局，推荐）
#
# 优先级：命令行显式设置的 flag > 配置文件 > 内置默认值。
# 仅在此文件中出现、且命令行未显式设置的字段才会覆盖默认值。
# 用法：
#   portmap -config config.yaml                 # forward 子命令读取 forward: 段
#   portmap proxy -config config.yaml           # proxy 子命令读取 proxy: 段
#
# 配置按子命令分段；开启严格校验（KnownFields），出现未知字段会直接报错。
# 下列字段均为可选，未出现的字段将沿用内置默认值。

# forward 子命令（TCP/UDP 端口转发）
forward:
  # 本地监听端口（默认 22）
  listen_port: 22
  # 本地监听地址，留空表示所有网卡（默认空）
  listen_host: ""
  # 转发目标地址 host:port（默认 127.0.0.1:2222）
  target: 127.0.0.1:2222
  # 转发模式：go（纯 Go 实现）或 socat（调用系统 socat），默认 go
  mode: go
  # 转发协议：tcp 或 udp（默认 tcp）
  proto: tcp
  # 是否启用 SO_REUSEADDR（默认 true）
  reuseaddr: true
  # socat 模式下是否以 sudo 运行（默认 false）
  sudo: false
  # 拨号到目标的超时时间，字符串写法（如 10s、1m），默认 10s
  dial_timeout: 10s
  # 最大并发连接数，0 表示不限制（仅 go 模式；UDP 下限制并发会话数），默认 0
  max_conns: 0
  # 空闲超时，TCP 下任一方向空闲超过阈值即回收该方向连接，0 表示不启用（仅 go 模式；UDP 下 0 表示默认 60s），默认 0
  idle_timeout: 0s
  # 日志级别：info 或 debug（仅 go 模式，默认 info）
  log_level: info
  # 安静模式，抑制每连接的常规日志（仅 go 模式，默认 false）
  quiet: false

# proxy 子命令（单端口 SOCKS5 + HTTP 代理）
proxy:
  # 监听地址，SOCKS5 与 HTTP 共用此端口（默认 127.0.0.1:1080）
  addr: 127.0.0.1:1080
  # 出站连接超时时间，字符串写法（如 30s、1m），默认 30s
  dial_timeout: 30s
  # 最大并发客户端连接数，0 表示不限制（默认 256）
  max_conns: 256
  # 协议探测与 HTTP/SOCKS5 握手超时，0 表示不限制（默认 10s）
  handshake_timeout: 10s
  # 隧道双向空闲超时，0 表示不限制（默认 5m）
  idle_timeout: 5m
  # 是否允许监听非回环地址。代理不提供认证，仅应在受保护网络中开启（默认 false）
  allow_public: false
  # 上游代理链：出站连接经此上游转发，留空表示直连（默认空）。
  # 形如 socks5://user:pass@host:1080、http://host:3128、ssh://user@host:22
  upstream: ""
  # SSH 上游认证使用的私钥文件路径（仅 ssh 上游，默认空）
  upstream_identity: ""
  # SSH 上游 host key 校验使用的 known_hosts 路径（仅 ssh 上游，默认 ~/.ssh/known_hosts）
  upstream_known_hosts: ""
  # 是否跳过 SSH 上游 host key 校验（不安全，仅用于自建测试环境，默认 false）
  upstream_insecure: false

# 界面语言：en/zh/ja/ko/fr/de（默认自动检测系统语言）
# 注意：该字段仅影响运行期消息（日志/错误），不影响 --help 与 flag 描述的语言
# （因为 --help 在配置文件加载前就已定稿）。若需改变 --help 语言，请用命令行 -lang。
lang: en

# 向后兼容：旧版“平铺 forward”布局（顶层直接写 listen_port/target/... ）仍受支持，
# portmap 会自动识别并归一化到 forward: 段。建议新配置使用上面的嵌套布局。
