# portmap 配置文件示例（顶层嵌套布局，推荐）
#
# 优先级：命令行显式设置的 flag > 配置文件 > 内置默认值。
# 仅在此文件中出现、且命令行未显式设置的字段才会覆盖默认值。
# 用法：
#   portmap -config config.yaml                 # forward 子命令读取 forward: 段
#   portmap proxy -config config.yaml           # proxy 子命令读取 proxy: 段
#
# 配置按子命令分段；开启严格校验（KnownFields），出现未知字段会直接报错。
# 下列字段均为可选，未出现的字段将沿用内置默认值。

# forward 子命令（TCP/UDP 端口转发）
forward:
  # 本地监听端口（默认 22）
  listen_port: 22
  # 本地监听地址，留空表示所有网卡（默认空）
  listen_host: ""
  # 转发目标地址 host:port（默认 127.0.0.1:2222）
  target: 127.0.0.1:2222
  # 转发模式：go（纯 Go 实现）或 socat（调用系统 socat），默认 go
  mode: go
  # 转发协议：tcp 或 udp（默认 tcp）
  proto: tcp
  # 是否启用 SO_REUSEADDR（默认 true）
  reuseaddr: true
  # socat 模式下是否以 sudo 运行（默认 false）
  sudo: false
  # 拨号到目标的超时时间，字符串写法（如 10s、1m），默认 10s
  dial_timeout: 10s
  # 最大并发连接数，0 表示不限制（仅 go 模式；UDP 下限制并发会话数），默认 256
  max_conns: 256
  # 空闲超时，TCP 下双向均无数据超过阈值才断开，0 表示不启用
  # （仅 go 模式；UDP 下显式设为 0 时仍使用 60s 会话回收），默认 5m
  idle_timeout: 5m
  # 日志级别：info 或 debug（仅 go 模式，默认 info）
  log_level: info
  # 安静模式，抑制每连接的常规日志（仅 go 模式，默认 false）
  quiet: false
  # 可选的 HTTP 统计端点地址（如 127.0.0.1:9090），留空表示关闭。
  # 暴露 /stats（JSON）与 /metrics（Prometheus 文本）；仅允许绑定回环地址。
  stats_addr: ""
  # 可选的 Web 面板监听地址（如 127.0.0.1:8080），留空表示关闭。
  # 启用后可在浏览器查看实时性能统计与访问/连接日志；默认仅允许绑定回环地址。
  web_addr: ""
  # Web 面板连接事件环形缓冲保留的最大条数（默认 1000）
  web_log_max: 1000

# proxy 子命令（单端口 SOCKS5 + HTTP 代理）
proxy:
  # 监听地址，SOCKS5 与 HTTP 共用此端口（默认 127.0.0.1:1080）
  addr: 127.0.0.1:1080
  # 出站连接超时时间，字符串写法（如 30s、1m），默认 30s
  dial_timeout: 30s
  # 最大并发客户端连接数，0 表示不限制（默认 256）
  max_conns: 256
  # 协议探测与 HTTP/SOCKS5 握手超时，0 表示不限制（默认 10s）
  handshake_timeout: 10s
  # 隧道双向空闲超时，0 表示不限制（默认 5m）
  idle_timeout: 5m
  # 是否允许监听非回环地址。代理不提供认证，仅应在受保护网络中开启（默认 false）
  allow_public: false
  # 上游代理链：出站连接经此上游转发，留空表示直连（默认空）。
  # 形如 socks5://user:pass@host:1080、http://host:3128、ssh://user@host:22
  #
  # ssh 上游的登录密码可写在 URL 中（ssh://user:pass@host:22，特殊字符需
  # percent-encode）；未在 URL 中提供密码、也未配置 upstream_identity 时，
  # 密码取自环境变量 PORTMAP_UPSTREAM_PASSWORD，环境变量为空且 stdin 是终端
  # 时会交互式提示输入（不回显）。stdin 非终端（后台运行、systemd、管道等）
  # 或 ssh-agent 可用（见下方 upstream_agent）时跳过提示；若此时也没有其它可用的
  # 认证方式，则直接报缺少认证方式的错误。
  upstream: ""
  # 是否启用 ssh-agent 认证（仅 ssh 上游，默认 true）。
  # 认证尝试顺序：ssh-agent > upstream_identity 私钥 > 密码。
  # agent 不可用（socket 路径为空或连接失败）时静默跳过，不报错，对现有配置向后兼容。
  # 「可用」以真实连接一次 socket 为准：socket 路径残留但 agent 已退出时判为不可用，
  # 交互式口令提示会照常出现，而不会被压制。
  # 推荐把加密私钥的口令交给 agent 保管，例如 macOS 上执行：
  #   ssh-add --apple-use-keychain ~/.ssh/keys/litchi/litchi-2018
  # 注意：Windows 的 ssh-agent 走 named pipe 而非 unix socket，不受支持。
  upstream_agent: true
  # ssh-agent 的 unix socket 路径（仅 ssh 上游，默认空）。
  # 留空表示读取环境变量 SSH_AUTH_SOCK。
  upstream_agent_socket: ""
  # SSH 上游认证使用的私钥文件路径（仅 ssh 上游，默认空）。
  # 支持 ~ 开头的路径，会展开为当前用户的 home 目录。
  # 注意：配置了私钥后不会再提示输入登录密码（两种认证方式互斥）。
  upstream_identity: ""
  # 加密私钥的 passphrase（仅 ssh 上游，默认空）。优先级：环境变量
  # PORTMAP_UPSTREAM_IDENTITY_PASSPHRASE > 此配置项 > 交互式终端输入。
  # 出于安全考虑不提供命令行 flag；推荐使用环境变量而非明文写入配置文件，
  # 若确需写入 YAML 请自行控制文件权限。
  # upstream_identity_passphrase: ""
  # SSH 上游 host key 校验使用的 known_hosts 路径（仅 ssh 上游，默认 ~/.ssh/known_hosts）。
  # 支持 ~ 开头的路径，会展开为当前用户的 home 目录。
  upstream_known_hosts: ""
  # 是否跳过 SSH 上游 host key 校验（不安全，仅用于自建测试环境，默认 false）
  upstream_insecure: false
  # SSH 上游主动保活探测间隔（仅 ssh 上游）。字符串写法（如 30s、1m）。
  # 0 或留空表示默认 30s；负数（如 -1s）表示禁用主动保活，退回被动重连。
  upstream_keepalive: 30s
  # 连续保活探测失败多少次后判定断线并触发后台重连（仅 ssh 上游，默认 3）
  upstream_keepalive_max_failures: 3
  # 可选的 HTTP 统计端点地址（如 127.0.0.1:9090），留空表示关闭。
  # 暴露 /stats（JSON）与 /metrics（Prometheus 文本）；默认仅允许回环地址。
  stats_addr: ""
  # 是否允许统计端点监听非回环地址；与代理监听器的 allow_public 独立（默认 false）
  stats_allow_public: false
  # 可选的 Web 面板监听地址（如 127.0.0.1:8080），留空表示关闭。
  # 启用后可在浏览器查看实时性能统计与访问/连接日志；默认仅允许回环地址。
  web_addr: ""
  # 是否允许 Web 面板监听非回环地址；与代理监听器的 allow_public 独立（默认 false）
  web_allow_public: false
  # Web 面板连接事件环形缓冲保留的最大条数（默认 1000）
  web_log_max: 1000

# 界面语言：en/zh/ja/ko/fr/de（默认自动检测系统语言）
# 注意：该字段仅影响运行期消息（日志/错误），不影响 --help 与 flag 描述的语言
# （因为 --help 在配置文件加载前就已定稿）。若需改变 --help 语言，请用命令行 -lang。
lang: en

# 向后兼容：旧版“平铺 forward”布局（顶层直接写 listen_port/target/... ）仍受支持，
# portmap 会自动识别并归一化到 forward: 段。建议新配置使用上面的嵌套布局。

# 多端口映射（多实例）
#
# forward: 与 proxy: 均支持写成「对象列表」，用于在一次运行中同时启动多个端口映射
# （每个列表元素即一个实例，字段与上面的单对象写法完全一致）。多实例只能在配置
# 文件中表达；CLI 仍是单实例语义（如 portmap proxy -addr ... -upstream ...）。
#
# 注意：
#   - 多实例场景下，命令行的 per-instance flag（如 -listen-port/-addr/-upstream 等）
#     无法一一对应到某个实例，会被忽略并在日志中提示；-config/-lang 仍生效。
#   - 各实例的监听地址（forward 为 listen_host:listen_port，proxy 为 addr）不得重复，
#     否则启动时报错。
#   - 单对象写法（如上面的 forward:/proxy:）与旧版平铺布局完全兼容，视为 1 个实例。
#
# 多实例示例：
#
#   forward:
#     - listen_port: 22
#       target: 127.0.0.1:2222
#     - listen_port: 80
#       target: 127.0.0.1:8080
#       proto: tcp
#
#   proxy:
#     - addr: 0.0.0.0:8118
#       allow_public: true
#       upstream: ssh://root@10.10.10.10
#       upstream_identity: ~/.ssh/id_rsa
#       upstream_keepalive: 30s
#       upstream_keepalive_max_failures: 3
#     - addr: 127.0.0.1:1080
#       upstream: socks5://user:pass@host:1080
